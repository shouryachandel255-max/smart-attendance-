{% extends "base.html" %}
{% block title %}Check In · Smart Attendance{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Check In</h1>
    <p class="text-slate-500 text-sm mb-6">Enter the 6-digit PIN provided by your teacher.</p>

    <form method="POST" action="{{ url_for('join_session') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Session PIN</label>
            <input type="text" name="pin" required pattern="[0-9]{6}" maxlength="6"
                   placeholder="000000"
                   class="w-full text-center text-3xl font-mono tracking-widest border border-slate-300 rounded-lg px-3 py-3 focus:ring-2 focus:ring-green-500 focus:outline-none" />
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">
                Submit
            </button>
            <a href="{{ url_for('dashboard') }}"
               class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-center">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
