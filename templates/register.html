{% extends "base.html" %}
{% block title %}Register · Smart Attendance{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">Create Account</h1>
    <p class="text-center text-slate-500 text-sm mb-6">
        Join the Smart Attendance System
    </p>
    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
            <input type="text" name="name" required value="{{ name or '' }}"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
            <input type="text" name="username" required minlength="3" value="{{ username or '' }}"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email <span class="text-slate-400">(optional)</span></label>
            <input type="email" name="email" value="{{ email or '' }}"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center gap-2 border border-slate-300 rounded-lg px-3 py-2 cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500">
                    <input type="radio" name="role" value="student" {% if role != 'teacher' %}checked{% endif %} />
                    <span>Student</span>
                </label>
                <label class="flex items-center gap-2 border border-slate-300 rounded-lg px-3 py-2 cursor-pointer has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500">
                    <input type="radio" name="role" value="teacher" {% if role == 'teacher' %}checked{% endif %} />
                    <span>Teacher</span>
                </label>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required minlength="8"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
            <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
            <input type="password" name="confirm_password" required minlength="8"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <button type="submit"
                class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-2 rounded-lg transition">
            Create Account
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account?
        <a href="{{ url_for('login') }}" class="text-indigo-600 hover:underline">Sign in</a>
    </p>
</div>
{% endblock %}
