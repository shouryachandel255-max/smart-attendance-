{% extends "base.html" %}
{% block title %}Create Session · Smart Attendance{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Create Attendance Session</h1>
    <p class="text-slate-500 text-sm mb-6">Generate a 6-digit PIN for students to check in.</p>

    <form method="POST" action="{{ url_for('create_session') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Session Title</label>
            <input type="text" name="title" required placeholder="e.g. CS101 - Lecture 5"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Duration (minutes)</label>
            <input type="number" name="duration" value="30" min="1" max="1440"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
            <p class="text-xs text-slate-500 mt-1">The PIN will expire after this duration.</p>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit"
                    class="bg-indigo-700 hover:bg-indigo-800 text-white font-semibold px-5 py-2 rounded-lg">
                Generate PIN
            </button>
            <a href="{{ url_for('dashboard') }}"
               class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
